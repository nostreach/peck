<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!--
    Mobile setup:
    - viewport-fit=cover: extend into notch/home-indicator areas
    - maximum-scale=1.0 + user-scalable=no: zoom lock. This is controversial
      for accessibility, but essential for peck — zoom-out + pull-down at
      the top triggers a native browser reload, which tears down the
      WebRTC tunnel and forces a new hole punch. Locking zoom kills that
      attack surface entirely.
    - For users who need zoom we can revisit via a settings toggle later.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- Color the browser chrome (Safari address bar, Android status bar) -->
  <meta name="theme-color" content="#0d1117">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!--
    Content-Security-Policy (PRIV-5 mitigation):
    Tunneled page content executes in the same browser origin as the peck
    client. This CSP limits the damage: tunneled scripts can run inline but
    cannot load external resources or connect to arbitrary endpoints.
    - default-src 'self': only load resources from this origin
    - script-src 'self' 'unsafe-inline': allow inline scripts (peck client
      architecture requires this — tunneled pages inject <script> tags)
    - connect-src 'self' wss: ws: https:: allow WebSocket (Nostr relays) + DoH TXT lookups (https://)
    - img-src 'self' data:: allow inline images from tunneled content
    - style-src 'self' 'unsafe-inline': allow inline styles
    Note: This CSP does NOT prevent tunneled scripts from reading cookies or
    sessionStorage — see README "Security Model" section for the full picture.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; connect-src 'self' wss: ws: https:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; form-action 'self'; base-uri 'self'; object-src 'none';">
  <title>peck</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      overflow: hidden;
      /* Mobile: disable pull-to-refresh and rubber-band scrolling.
         Without this, zooming out and pulling down at the top of the
         page reloads the browser — which tears down the WebRTC tunnel
         and forces a new hole punch. overscroll-behavior covers most
         modern browsers; the touchstart handler below covers iOS Safari. */
      overscroll-behavior-y: contain;
      /* touch-action: manipulation kills the 300ms tap delay on mobile
         without allowing pinch-zoom (which we disabled in the viewport
         meta anyway). Combined with user-scalable=no this is belt+suspenders. */
      touch-action: manipulation;
      /* Respect notches/home indicators on iPhone X+. */
      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
    }

    /* ─── Header Bar (glassmorphism, single 44px line) ─── */
    #peck-header {
      position: fixed;
      top: env(safe-area-inset-top, 0);
      left: 0; right: 0;
      height: 44px;  /* 44px = iOS/Android recommended touch target */
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0 0.75rem;
      background: rgba(13,17,23,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid #30363d;
      font-size: 14px;
      z-index: 100000;
    }

    /* Spec 039: Vault password prompt (inline in header) */
    #vault-prompt {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      flex-shrink: 0;
      margin-left: auto;
    }
    #vault-prompt input[type=password] {
      background: #161b22; border: 1px solid #30363d; color: #e6edf3;
      padding: 4px 8px; border-radius: 4px; font-size: 13px;
      width: 80px; min-width: 60px;
    }
    #vault-prompt .vault-btn {
      background: #238636; color: #fff; border: none; padding: 4px 8px;
      border-radius: 4px; font-size: 13px; cursor: pointer; white-space: nowrap;
    }
    #vault-prompt .vault-btn-secondary {
      background: #21262d; color: #8b949e; border: 1px solid #30363d;
    }
    #vault-prompt .vault-error { color: #f85149; font-size: 12px; }

    #status-dot {
      width: 10px; height: 10px; border-radius: 50%;
      flex-shrink: 0; transition: background 0.2s;
    }
    #status-dot.connecting { background: #d29922; animation: pulse 1.2s ease-in-out infinite; }
    #status-dot.connected  { background: #3fb950; box-shadow: 0 0 8px currentColor; }
    #status-dot.failure    { background: #f85149; }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: 0.6; } 50% { transform: scale(1.3); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      #status-dot.connecting { animation: none; }
    }
    #npub-display {
      font-family: monospace; color: #8b949e;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      min-width: 0; flex-shrink: 1;
    }
    #header-diag {
      font-family: monospace; font-size: 11px; color: #3fb950;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      flex: 1; min-width: 0;
    }
    #info-toggle {
      margin-left: auto; color: #8b949e; background: none;
      border: none; cursor: pointer; font-size: 16px;
      font-family: inherit; padding: 4px 6px; border-radius: 4px;
      flex-shrink: 0;
    }
    #info-toggle:hover { color: #c9d1d9; background: #21262d; }
    #settings-toggle {
      color: #8b949e; background: none;
      border: none; cursor: pointer; font-size: 16px;
      font-family: inherit; padding: 4px 6px; border-radius: 4px;
      flex-shrink: 0;
    }
    #settings-toggle:hover { color: #c9d1d9; background: #21262d; }

    /* Show header diagnostics only on wide screens */
    @media (max-width: 900px) {
      #header-diag { display: none; }
    }

    /* ─── Relay Pills + Exit IP Chips (inside settings panel) ─── */
    #peck-relays {
      display: flex; flex-wrap: wrap; gap: 4px;
    }
    .relay-pill {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 8px; border-radius: 6px; font-size: 11px;
      font-family: monospace;
    }
    .relay-pill.connected {
      border: 1px solid #3fb950; color: #3fb950; background: rgba(63,185,80,0.1);
    }
    .relay-pill.failed {
      border: 1px solid #f85149; color: #f85149; background: rgba(248,81,73,0.1);
    }
    .relay-list { display: flex; flex-direction: column; gap: 4px; }
    .relay-item {
      display: flex; align-items: center; gap: 6px;
    }
    .relay-item input {
      flex: 1; padding: 3px 8px; background: #161b22;
      border: 1px solid #30363d; border-radius: 4px;
      color: #c9d1d9; font-family: monospace; font-size: 12px;
    }
    .relay-btn {
      width: 26px; height: 26px; border: 1px solid #30363d;
      border-radius: 6px; background: #21262d; color: #c9d1d9;
      cursor: pointer; font-size: 14px; font-weight: 600;
      line-height: 1; flex-shrink: 0; display: flex;
      align-items: center; justify-content: center;
    }
    .relay-btn:hover { background: #30363d; }
    .relay-status-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .ip-list {
      display: flex; flex-direction: column; gap: 3px;
      min-width: 0;  /* allow flex children to shrink below content size */
    }
    .ip-row {
      display: flex; align-items: center; gap: 6px;
      padding: 3px 8px; border-radius: 6px; font-size: 12px;
      font-family: monospace;
      overflow: hidden;
      min-width: 0;  /* prevent row from expanding beyond container */
    }
    .ip-row .ip-text {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1;
    }
    .ip-row.connected {
      background: rgba(63,185,80,0.12); border: 1px solid rgba(63,185,80,0.4);
      font-weight: 600;
    }
    .ip-row.global {
      background: rgba(255,255,255,0.04); border: 1px solid #30363d;
    }
    .ip-row.local {
      background: transparent; border: 1px solid #21262d; color: #6e7681;
    }
    .ip-row .ip-type {
      font-size: 10px; color: #6e7681; margin-left: auto; flex-shrink: 0;
    }
    .ipver-badge {
      font-size: 10px; padding: 1px 6px; border-radius: 4px;
      background: rgba(95,150,255,0.15); color: #58a6ff;
      border: 1px solid rgba(95,150,255,0.3); margin-top: 4px;
    }

    /* ─── Settings Panel (slide-in from right) ─── */
    #peck-settings {
      position: fixed;
      top: 0; right: 0;
      width: 320px; height: 100%;
      transform: translateX(100%);
      transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
      z-index: 100001;
    }
    #peck-settings.open { transform: translateX(0); }
    #peck-settings-backdrop {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.4);
      opacity: 0; pointer-events: none; transition: opacity 0.25s;
      z-index: 1;
    }
    #peck-settings.open #peck-settings-backdrop {
      opacity: 1; pointer-events: auto;
    }
    #peck-settings-content {
      position: relative;
      z-index: 2;
      background: rgba(22,27,34,0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      width: 320px; height: 100%;
      overflow-y: auto;
      padding: 0.75rem;
      display: flex; flex-direction: column; gap: 0.75rem;
      border-left: 1px solid #30363d;
      box-shadow: -4px 0 20px rgba(0,0,0,0.4);
    }
    #peck-resize-handle {
      position: absolute;
      top: 0; left: 0;
      width: 4px; height: 100%;
      cursor: col-resize;
      background: transparent;
      z-index: 3;
    }
    #peck-resize-handle:hover, #peck-resize-handle.dragging {
      background: #f59e0b;
    }
    .settings-header {
      display: flex; align-items: center; justify-content: space-between;
    }
    .settings-header h3 { font-size: 16px; color: #c9d1d9; }
    #settings-close {
      color: #8b949e; background: none; border: none; cursor: pointer;
      font-size: 16px; padding: 4px 8px; border-radius: 4px;
    }
    #settings-close:hover { color: #c9d1d9; background: #21262d; }
    .settings-section {
      display: flex; flex-direction: column; gap: 0.5rem;
      padding-bottom: 0.75rem; border-bottom: 1px solid #21262d;
      min-width: 0;  /* allow IP rows to shrink within */
    }
    .settings-section:last-child { border-bottom: none; }
    .settings-label {
      font-size: 11px; color: #6e7681; text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .settings-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 0.5rem;
      font-size: 13px; color: #c9d1d9;
    }
    .settings-hint { font-size: 11px; color: #6e7681; }
    .settings-btn {
      padding: 4px 12px; background: #21262d; border: 1px solid #30363d;
      border-radius: 4px; color: #c9d1d9; cursor: pointer;
      font-size: 12px; font-family: inherit;
    }
    .settings-btn:hover { background: #30363d; }
    /* Toggle slider */
    .toggle {
      position: relative; width: 44px; height: 24px; background: #30363d;
      border-radius: 12px; cursor: pointer; transition: background 0.2s;
      flex-shrink: 0;
    }
    .toggle.on { background: #f59e0b; }
    .toggle::after {
      content: ''; position: absolute; top: 2px; left: 2px;
      width: 20px; height: 20px; background: #fff; border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle.on::after { transform: translateX(20px); }
    /* Segmented control */
    .seg-control {
      display: inline-flex; border: 1px solid #30363d;
      border-radius: 6px; overflow: hidden;
    }
    .seg-control button {
      padding: 6px 14px; background: transparent; border: none;
      color: #8b949e; font-size: 12px; cursor: pointer;
    }
    .seg-control button.active {
      background: #f59e0b; color: #0d1117; font-weight: 600;
    }
    .seg-control button:disabled { opacity: 0.3; cursor: not-allowed; }
    /* Debug rows (reused in Connection section) */
    .debug-row { display: flex; gap: 0.5rem; align-items: center; }
    .debug-row label {
      font-size: 11px; color: #6e7681; width: 40px;
      flex-shrink: 0; text-transform: uppercase; letter-spacing: 0.05em;
    }
    .debug-row input {
      flex: 1; padding: 4px 8px; background: #161b22;
      border: 1px solid #30363d; border-radius: 4px;
      color: #c9d1d9; font-family: monospace; font-size: 12px;
    }
    .debug-row input:focus { outline: none; border-color: #1f6feb; }
    #btn-reconnect {
      padding: 4px 12px; background: #21262d; border: 1px solid #30363d;
      border-radius: 4px; color: #c9d1d9; cursor: pointer;
      font-size: 12px; font-family: inherit;
    }
    #btn-reconnect:hover { background: #30363d; }
    #log {
      background: #161b22; border: 1px solid #30363d; border-radius: 4px;
      padding: 6px 8px; font-family: monospace; font-size: 11px;
      height: 140px; overflow-y: auto; white-space: pre-wrap;
      word-break: break-all; color: #8b949e;
    }
    #log .log-ok { color: #3fb950; }
    #log .log-err { color: #f85149; }
    #diag {
      font-size: 11px; color: #888; padding: 4px 12px;
      word-break: break-all; font-family: monospace;
    }
    #advanced-toggle {
      background: none; border: none; color: #6e7681; cursor: pointer;
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
      padding: 0; font-family: inherit;
    }
    #advanced-toggle:hover { color: #c9d1d9; }

    /* ─── Tunneled Content ─── */
    #tunneled-content {
      /* Offset by header height + safe-area-top (notch/status bar). */
      margin-top: calc(env(safe-area-inset-top, 0) + 44px);
      /* Leave room for bottom home indicator on iPhone X+. */
      margin-bottom: env(safe-area-inset-bottom, 0);
      width: 100%;
      height: calc(100% - env(safe-area-inset-top, 0) - 44px - env(safe-area-inset-bottom, 0));
      /* Vertical scroll OK, horizontal scroll locked. This is the key
         fix for the "105% width / draggable sideways" mobile bug —
         tunneled content that's wider than viewport gets clipped rather
         than extending the page horizontally. */
      overflow-x: hidden;
      overflow-y: auto;
      /* Allow the tunneled page to scroll but not rubber-band (which
         would otherwise propagate to the host and trigger pull-to-refresh
         on browsers that ignore overscroll-behavior on parent). */
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      /* pan-x pan-y allows scrolling in both directions, disables pinch-zoom
         even if viewport meta is somehow ignored. */
      touch-action: pan-x pan-y;
    }

    /* ─── Loading Bar ─── */
    #peck-loading-bar {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0) + 44px); left: 0; right: 0;
      height: 2px;
      z-index: 100001;
      pointer-events: none;
    }
    #peck-loading-fill {
      height: 100%;
      width: 0;
      background: #58a6ff;
      opacity: 0;
      box-shadow: 0 0 8px rgba(88, 166, 255, 0.5);
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "@noble/secp256k1": "/vendor/secp256k1.mjs",

      "@noble/ciphers/chacha.js": "/vendor/chacha.mjs"
    }
  }
  </script>
</head>
<body>

  <div id="peck-header">
    <span id="status-dot" class="connecting"></span>
    <span id="npub-display">initializing…</span>
    <span id="header-diag"></span>
    <!-- Spec 039: Vault password prompt (inline in header, hidden after decrypt/skip) -->
    <div id="vault-prompt" style="display:none">
      <input type="password" id="vault-password" placeholder="Password" autocomplete="off" spellcheck="false">
      <button id="vault-decrypt" class="vault-btn">🔓</button>

  <div id="peck-settings">

        <input type="hidden" id="debug-relay" value="wss://relay.damus.io, wss://relay.primal.net, wss://relay.nostr.net, wss://nostr.oxtr.dev, wss://no.str.cr">
        <button id="btn-reconnect" class="settings-btn">Reconnect</button>

      <div class="settings-section">

  <div id="tunneled-content"></div>

  <script type="module">
    import { connect, formatDiagnostics, generateKeypair, deriveNpub } from '../src/client.js?v=20260801'
    // NativeTransport is the default in client.js now — no _transport needed.
    // We import it only so it gets loaded for debugging in the console.
    import { NativeTransport } from '../src/native-transport.js?v=20260730t'
    import { lookupCountry, ccToFlag, getCachedCountry, _whenGeoipReady } from '../src/wg-country-codes.js?v=20260730t'

    // Expose for debugging
    window.NativeTransport = NativeTransport

    let tunnel = null
    let tunnelReady = false   // false during connect(), true once peer connected
    let diagInterval = null
    let currentPath = '/'  // track for reconnect restore

    // Spec 034: Enhanced Connection UI state
    let relayStates = {}  // {url: 'connected' | 'failed' | 'closed'}
    let daemonExitIPs = []  // [{ip, cc, flag}]
    let daemonIpVersions = { v4: false, v6: false }
    let settingsOpen = false
    let ownExitIPs = []
    let ownIpVersions = { v4: false, v6: false }

    const $ = id => document.getElementById(id)

    // Root domain for generic info text (e.g. "dns2nostr.com" from "npub1abc.dns2nostr.com")
    const SITE_DOMAIN = location.hostname.split('.').slice(-2).join('.')

    // ─── Spec 037: Server Config ───
    const PECK_DEFAULTS = {
      default_relays: [
        'wss://relay.damus.io',
        'wss://relay.primal.net',
        'wss://relay.nostr.net',
        'wss://nostr.oxtr.dev',
        'wss://no.str.cr'
      ],
      reconnect: {
        max_attempts: 3,
        delays_ms: [5000, 10000, 20000]
      },
      ice_gathering_timeout_ms: 3000,
      info_mandatory: 'never'
    }
    let PECK_CONFIG = { ...PECK_DEFAULTS }

    async function loadServerConfig() {
      try {
        const resp = await fetch('peck-config.json', { cache: 'no-store' })
        if (!resp.ok) return
        const data = await resp.json()
        PECK_CONFIG = {
          ...PECK_DEFAULTS,
          ...data,

    function peckRemoveSetting(key) {
      const domain = '.' + SITE_DOMAIN

    // ─── Spec 039: Encrypted Settings Vault ─────────────────────────────
    // Optional password-protected AES-256-GCM encryption for settings.
    // When enabled, all peck_* settings are stored as a single peck_vault
    // cookie (base64 of [version:2][salt:16][iv:12][ciphertext+tag]).
    // Tunneled page scripts see only ciphertext in document.cookie.

    const VAULT_COOKIE = 'peck_vault'
    // v1 = PBKDF2 100K iterations (pre-audit)
    // v2 = PBKDF2 600K iterations (SEC-8 audit fix, OWASP 2026)
    const VAULT_VERSION = 2

    // Decrypted settings live here (null = not yet decrypted / using defaults)
    let _vaultSettings = null  // null = no vault OR not decrypted; object = decrypted
    let _vaultActive = false    // true = vault cookie exists

    let _vaultSkipped = false   // true = user clicked Skip (vault untouched, defaults in use)
    let _vaultPassword = null   // retained for auto-reencrypt (FR-019); cleared on disable
    let _vaultReencryptTimer = null

    // (renderIdentity reads these before startConnection sets them)
    let _ephemeralNpub = null
    let _ephemeralNsec = null

    function vaultHasCookie() {
      return document.cookie.split('; ').some(c => c.startsWith(VAULT_COOKIE + '='))
    }

    function _getVaultCookieValue() {
      const c = document.cookie.split('; ').find(c => c.startsWith(VAULT_COOKIE + '='))
      if (!c) return null
      return decodeURIComponent(c.slice(VAULT_COOKIE.length + 1))
    }

      const domain = '.' + SITE_DOMAIN
      document.cookie = `${VAULT_COOKIE}=${encodeURIComponent(b64blob)};domain=${domain};max-age=31536000;path=/;SameSite=Lax;Secure`

      document.cookie = `${VAULT_COOKIE}=;domain=${domain};max-age=0;path=/;SameSite=Lax;Secure`

    async function _deriveKey(password, salt, iterations = 600000) {
      const enc = new TextEncoder()
      const keyMaterial = await crypto.subtle.importKey(
        'raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']
      )
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt, iterations, hash: 'SHA-256' },
        keyMaterial,
        { name: 'AES-GCM', length: 256 },
        false,
        ['encrypt', 'decrypt']
      )
    }

    async function vaultEncrypt(settingsObj, password) {
      const salt = crypto.getRandomValues(new Uint8Array(16))
      const iv = crypto.getRandomValues(new Uint8Array(12))
      const key = await _deriveKey(password, salt)
      const enc = new TextEncoder()
      const plaintext = enc.encode(JSON.stringify(settingsObj))
      const ciphertext = new Uint8Array(await crypto.subtle.encrypt(
        { name: 'AES-GCM', iv }, key, plaintext
      ))
      // Assemble blob: [version:2][salt:16][iv:12][ciphertext+tag]
      const blob = new Uint8Array(2 + 16 + 12 + ciphertext.length)
      const dv = new DataView(blob.buffer)
      dv.setUint16(0, VAULT_VERSION)
      blob.set(salt, 2)
      blob.set(iv, 18)
      blob.set(ciphertext, 30)
      // Base64 encode
      return btoa(String.fromCharCode(...blob))
    }

    async function vaultDecrypt(b64blob, password) {
      // Decode base64 → Uint8Array
      const binary = atob(b64blob)
      const blob = new Uint8Array(binary.length)
      for (let i = 0; i < binary.length; i++) blob[i] = binary.charCodeAt(i)

      if (blob.length < 2 + 16 + 12 + 16) throw new Error('vault too short')
      const dv = new DataView(blob.buffer)
      const version = dv.getUint16(0)

      // v1 (pre-audit) used 100K PBKDF2 iterations; v2 uses 600K
      let iterations
      if (version === 1) iterations = 100000
      else if (version === 2) iterations = 600000
      else throw new Error(`unsupported vault version ${version}`)

      const salt = blob.slice(2, 18)
      const iv = blob.slice(18, 30)
      const ciphertext = blob.slice(30)

      const key = await _deriveKey(password, salt, iterations)
      const plaintext = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv }, key, ciphertext
      )
      const dec = new TextDecoder()
      return JSON.parse(dec.decode(plaintext))
    }

    // ─── bech32m encode (hex → npub) ───────────────────────────────

    const BECH32_CHARSET = 'qpzry9x8gf2tvdw0s3jn54khce6mua7l'
    const BECH32M_CONST = 0x2bc830a3

    function bech32Polymod(values) {
      const GEN = [0x3b6a57b2, 0x26508e6d, 0x1ea119fa, 0x3d4233dd, 0x2a1462b3]
      let chk = 1
      for (const v of values) {
        let top = chk >> 25
        chk = ((chk & 0x1ffffff) << 5) ^ v
        for (let i = 0; i < 5; i++) {
          if (((top >> i) & 1) !== 0) chk ^= GEN[i]
        }
      }
      return chk
    }

    function bech32HRPExpand(hrp) {
      const ret = []
      for (let i = 0; i < hrp.length; i++) ret.push(hrp.charCodeAt(i) >> 5)
      ret.push(0)
      for (let i = 0; i < hrp.length; i++) ret.push(hrp.charCodeAt(i) & 31)
      return ret
    }

    function bech32Encode(hrp, data) {
      const values = bech32HRPExpand(hrp).concat(data)
      const polymod = bech32Polymod(values.concat([0,0,0,0,0,0])) ^ BECH32M_CONST
      const checksum = []
      for (let i = 0; i < 6; i++) {
        checksum.push((polymod >> 5 * (5 - i)) & 31)
      }
      return hrp + '1' + data.concat(checksum).map(v => BECH32_CHARSET[v]).join('')
    }

    function convertBitsEncode(data, fromBits, toBits, pad) {
      let acc = 0
      let bits = 0
      const ret = []
      const maxv = (1 << toBits) - 1
      const maxAcc = (1 << (fromBits + toBits - 1)) - 1
      for (const v of data) {
        acc = ((acc << fromBits) | v) & maxAcc
        bits += fromBits
        while (bits >= toBits) {
          bits -= toBits
          ret.push((acc >> bits) & maxv)
        }
      }
      if (pad && bits > 0) {
        ret.push((acc << (toBits - bits)) & maxv)
      }
      return ret
    }

    function hexToNpub(hex) {

      const data5 = convertBitsEncode(bytes, 8, 5, true)

    const DOH_ENDPOINTS = [

    async function resolveNpubViaDoH(hostname) {

            encodeURIComponent(hostname) + '&type=TXT',
            { headers: { 'Accept': 'application/dns-json' } })
          if (!resp.ok) continue
          const data = await resp.json()
          if (data.Status !== 0 || !data.Answer) continue
          for (const a of data.Answer) {
            if (a.type !== 16) continue  // TXT
            const txt = a.data.replace(/^"|\"$/g, '')
            const match = txt.match(/npub=([0-9a-f]{64})/i)
            if (match) return match[1]
          }
        } catch (e) {
          log('DoH ' + endpoint + ' failed: ' + e.message, 'log-err')
        }
      }
      return null
    }

    async function resolveNpub() {
      const hostname = window.location.hostname

      // Hostname layout: [sub.]CONTEXT.<root-domain>
      // where CONTEXT is npub1... or an alias (daniel, nostreach, ...).
      const labels = hostname.split('.').reverse()  // [tld, domain, ctx, sub, ...]

      // Check if hostname ends with the SITE_DOMAIN (derived from current hostname)
      // context is the label directly before the root domain
      const rootLabels = SITE_DOMAIN.split('.').reverse()  // [tld, domain]
      if (labels.length >= rootLabels.length + 1) {
        const isRootMatch = rootLabels.every((rl, i) => labels[i] === rl)
        if (isRootMatch) {
          const ctx = labels[rootLabels.length]
          if (ctx && ctx.length > 0 && ctx !== 'www') {
            // Primary: npub directly in URL — zero DNS footprint
            if (ctx.startsWith('npub1')) {
              return ctx
            }
            // Fallback: alias → DoH TXT lookup (discovery path)
            log('Resolving "' + ctx + '" via DoH…')
            const hexPubkey = await resolveNpubViaDoH(hostname)
            if (hexPubkey) {
              const npub = hexToNpub(hexPubkey)
              log('Resolved: ' + ctx + ' → ' + truncateNpub(npub))
              return npub
            }
            log('DoH: no TXT record for ' + hostname, 'log-err')
            return null
          }
        }
      }

      // Fallback 1: ?npub= query parameter (test/dev mode)
      const params = new URLSearchParams(window.location.search)
      const queryNpub = params.get('npub')
      if (queryNpub) return queryNpub

      // Fallback 2: sessionStorage (survives reload after pushState dropped ?npub=)
      const stored = sessionStorage.getItem('peck-npub')
      if (stored) return stored

      return null
    }

    /**
     * True if the npub comes from the subdomain (npub1....<root-domain>)
     * rather than from ?npub= query param or manual entry. When true,
     * we DON'T need to append ?npub= to tunnel URLs because the subdomain
     * survives navigations within the same origin.
     */
    function npubFromSubdomain() {
      const hostname = window.location.hostname
      const labels = hostname.split('.').reverse()
      const rootLabels = SITE_DOMAIN.split('.').reverse()
      if (labels.length >= rootLabels.length + 1) {
        const isRootMatch = rootLabels.every((rl, i) => labels[i] === rl)
        if (isRootMatch && labels[rootLabels.length] &&
            labels[rootLabels.length] !== 'www' &&
            labels[rootLabels.length].length > 0) {
          return true
        }
      }
      return false
    }

    /** Build a URL that preserves ?npub= across navigations.
     *  Only appends ?npub= when the npub comes from manual entry (?npub= or
     *  sessionStorage). When the npub is encoded in the subdomain, the
     *  subdomain survives navigations and ?npub= is redundant. */
    function tunneledUrl(path) {
      if (npubFromSubdomain()) return path  // subdomain is the carrier
      const npub = sessionStorage.getItem('peck-npub')
      const sep = path.includes('?') ? '&' : '?'
      return npub ? `${path}${sep}npub=${npub}` : path
    }

    // Spec 034: exit IP chip rendering
    function classifyIp(ip) {
      // Skip link-local, loopback, and Chrome mDNS (.local hostnames)
      if (ip.startsWith('169.254.') || ip === '::1') return 'skip'
      if (ip.endsWith('.local') || !ip.includes('.')) {
        // mDNS hostnames like "abc123.local" — Chrome privacy obfuscation
        if (!ip.match(/^\d+\.\d+\.\d+\.\d+$/) && !ip.includes(':')) return 'skip'
      }
      if (ip.startsWith('10.') || ip.startsWith('172.') || ip.startsWith('192.168.') || ip.startsWith('fd') || ip.startsWith('fe80')) return 'local'
      return 'global'
    }

    function renderIpList(container, ips, versions) {
      if (!ips.length) { container.innerHTML = '<div style="color:#6e7681;font-size:11px">—</div>'; return }
      // Sort: connected first, then global, then local
      const sorted = [...ips].sort((a, b) => {
        const rank = ip => ip.connected ? 0 : ip.class === 'global' ? 1 : 2
        return rank(a) - rank(b)
      })
      // Update flags — lazy load geoip-data.js on first call
      let needRerender = false
      sorted.forEach(e => {
        if (!e.cc) {
          const cc = lookupCountry(e.ip)
          if (cc) { e.cc = cc; e.flag = ccToFlag(cc) }
          else needRerender = true
        }
      })
      container.innerHTML = sorted.map(({ip, flag, cc, label, connected, cls}) => {
        const rowClass = connected ? 'ip-row connected' : `ip-row ${cls || 'global'}`
        const typeLabel = connected ? '◆ selected' : label || ''
        const safeIp = escapeHtml(ip)
        const safeType = escapeHtml(typeLabel)
        return `<div class="${rowClass}">${flag} <span class="ip-text">${safeIp}</span>${safeType ? `<span class="ip-type">${safeType}</span>` : ''}</div>`
      }).join('')
      // Add IP version badge
      let badge = ''
      if (versions.v4 && versions.v6) badge = '<span class="ipver-badge">IPv4+IPv6</span>'
      else if (versions.v4) badge = '<span class="ipver-badge">IPv4</span>'
      else if (versions.v6) badge = '<span class="ipver-badge">IPv6</span>'
      container.innerHTML += badge
      // If geoip-data.js was still loading, re-render after it finishes
      if (needRerender && !window._geoipRerenderScheduled) {
        window._geoipRerenderScheduled = true
        // Promise-based: wait for geoip data, then re-render
        _whenGeoipReady().then(() => {
          if (ownExitIPs.length) renderIpList(ownIpContainer, ownExitIPs, ownIpVersions)
          if (daemonExitIPs.length) renderIpList(exitContainer, daemonExitIPs, daemonIpVersions)
        }).catch(() => {})
      }
    }

    // Spec 034: parse offer SDP to extract exit IPs from ICE candidates
    // Host candidates carry the internal WG IP (172.x), srflx candidates
    // carry the public exit IP. We show both for leak detection.
    function parseOfferSdp(sdp) {
      const ips = []
      let hasV4 = false, hasV6 = false
      for (const line of sdp.split('\n')) {
        if (!line.startsWith('a=candidate')) continue
        const parts = line.split(' ')
        if (parts.length < 8) continue
        const ip = parts[4]
        const typeIdx = parts.indexOf('typ') + 1
        const candType = typeIdx > 0 ? parts[typeIdx] : 'host'
        if (candType === 'relay') continue
        const cls = classifyIp(ip)
        if (cls === 'skip') continue
        if (ip.includes(':')) hasV6 = true
        else if (ip.match(/^\d+\.\d+\.\d+\.\d+$/)) hasV4 = true
        const cc = lookupCountry(ip)
        const flag = cc ? ccToFlag(cc) : '❓'
        const label = candType === 'srflx' ? 'srflx' : candType === 'host' ? 'host' : ''
        if (!ips.find(e => e.ip === ip)) ips.push({ ip, flag, cc, label, connected: false, cls })
      }
      daemonExitIPs = ips
      daemonIpVersions = { v4: hasV4, v6: hasV6 }
      renderIpList(exitContainer, daemonExitIPs, daemonIpVersions)
      updateIpVersionControl()
      log(`Peer IPs from offer: ${ips.map(i => i.flag + ' ' + i.ip).join(', ')}`)
    }

    function parseAnswerSdp(sdp) {
      const ips = []
      let hasV4 = false, hasV6 = false
      for (const line of sdp.split('\n')) {
        if (!line.startsWith('a=candidate')) continue
        const parts = line.split(' ')
        if (parts.length < 8) continue
        const ip = parts[4]
        const typeIdx = parts.indexOf('typ') + 1
        const candType = typeIdx > 0 ? parts[typeIdx] : 'host'
        if (candType === 'relay') continue
        const cls = classifyIp(ip)
        if (cls === 'skip') continue
        if (ip.includes(':')) hasV6 = true
        else if (ip.match(/^\d+\.\d+\.\d+\.\d+$/)) hasV4 = true
        const cc = lookupCountry(ip)
        const flag = cc ? ccToFlag(cc) : '❓'
        const label = candType === 'srflx' ? 'srflx' : candType === 'host' ? 'host' : ''
        if (!ips.find(e => e.ip === ip)) ips.push({ ip, flag, cc, label, connected: false, cls })
      }
      ownExitIPs = ips
      ownIpVersions = { v4: hasV4, v6: hasV6 }
      renderIpList(ownIpContainer, ownExitIPs, ownIpVersions)
      log(`Own IPs from answer: ${ips.map(i => i.flag + ' ' + i.ip).join(', ')}`)
    }

    // Spec 034: STUN-resolved own IPs (bypasses mDNS obfuscation in
    // Chrome/Firefox). These are the real srflx IPs that STUN servers see.
    // Rebuilds the full list on every call so IP changes are reflected immediately.
    function handleOwnIpsFromStun(stunIps) {
      if (!stunIps || !stunIps.length) return
      const newIPs = []
      const newVersions = { v4: false, v6: false }
      const newExitSet = new Set()
      for (const ip of stunIps) {
        const cls = classifyIp(ip)
        if (cls === 'skip' || cls === 'local') continue
        newExitSet.add(ip)
        // Preserve flag/connected status if we already have this IP
        const existing = ownExitIPs.find(e => e.ip === ip)
        if (existing) {
          newIPs.push(existing)
        } else {
          const cc = lookupCountry(ip)
          const flag = cc ? ccToFlag(cc) : '❓'
          newIPs.push({ ip, flag, cc, label: 'srflx', connected: false, cls: 'global' })
        }
        if (ip.includes(':')) newVersions.v6 = true
        else if (ip.match(/^\d+\.\d+\.\d+\.\d+$/)) newVersions.v4 = true
      }
      // Replace the full list so removed IPs disappear
      ownExitIPs = newIPs
      ownIpVersions = newVersions
      lastKnownExitIPs = newExitSet
      renderIpList(ownIpContainer, ownExitIPs, ownIpVersions)
      log(`Own IPs from STUN: ${stunIps.join(', ')}`)
    }
