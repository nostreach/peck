    // ─── Service Worker (handles sub-assets: CSS, JS, images) ───

    async function setupServiceWorker() {
      if (!('serviceWorker' in navigator)) return null
      try {
        const reg = await navigator.serviceWorker.register('/sw.js')
        log('Service Worker registered')
        // Force update check to get latest version
        await reg.update()

        // Wait for active SW (handles update scenario)
        if (reg.active) return reg.active
        await new Promise(resolve => {
          const check = () => reg.active ? resolve() : setTimeout(check, 100)
          check()
        })
        return reg.active
      } catch (err) {
        log(`SW registration failed: ${err.message}`, 'log-err')
        return null
      }
    }

    // Clean up SW tunnel port when page unloads (reload, close, navigate away)
    // This prevents the next page load from hanging on a stale tunnel reference.
    window.addEventListener('beforeunload', () => {
      try {
        if (navigator.serviceWorker.controller) {
          navigator.serviceWorker.controller.postMessage({ type: 'UNREGISTER' })
        }
      } catch {}
    })

    function connectServiceWorker(sw) {
      return new Promise((resolve) => {
        const channel = new MessageChannel()
        const swPort = channel.port1
        const swRemotePort = channel.port2

        swPort.onmessage = async (event) => {
          const msg = event.data
          if (msg?.type === 'REGISTERED') {
            log('SW ↔ tunnel channel established')
            resolve()
            return
          }
          if (msg?.type === 'SW_LOG') {
            // Spec 041: Cookie sanitization logs from SW
            for (const line of msg.lines) log(line)
            return
          }
          if (msg?.type === 'TUNNEL_REQUEST') {
            try {
              // Spec 029: parse /_p<port>/ from request path, fall back to
              // currentPort (whatever the page is on), then defaultPort.
              const swParsed = parsePortPrefix(msg.path)
              const swPort = swParsed.port || currentPort || defaultPort
              const swPath = swParsed.path
              const res = await tunnel.request({
                port: swPort,
                method: msg.method,
                path: swPath,
                headers: msg.headers,
                body: msg.body ? new Uint8Array(msg.body) : null
              })
              const headers = {}
              for (const [k, v] of Object.entries(res.headers)) headers[k] = v
              swPort.postMessage({ id: msg.id, status: res.status, headers, body: Array.from(res.body) })
            } catch (err) {
              swPort.postMessage({ id: msg.id, error: err.message })
            }
          }
        }

        sw.postMessage({ type: 'REGISTER' }, [swRemotePort])
        setTimeout(() => resolve(), 3000)
      })
    }

    // ─── Navigation (fetch through tunnel, render in-page) ───

    // Loading bar element (now declared in HTML, just grab a reference)
    const loadingBar = $('peck-loading-bar')

    let loadingTimer = null

    function showLoading() {
      const fill = document.getElementById('peck-loading-fill')
      fill.style.width = '10%'
      fill.style.opacity = '1'
      fill.style.transition = 'width 0.4s ease'
      // Animate to 90% over time (never 100% until done)
      setTimeout(() => { fill.style.width = '40%' }, 100)
      setTimeout(() => { fill.style.width = '70%' }, 500)
      clearTimeout(loadingTimer)
      loadingTimer = setTimeout(() => {
        fill.style.width = '90%'
        fill.style.transition = 'width 2s ease'
      }, 1000)
    }

    function hideLoading() {
      clearTimeout(loadingTimer)
      const fill = document.getElementById('peck-loading-fill')
      fill.style.transition = 'width 0.1s ease, opacity 0.2s ease 0.1s'
      fill.style.width = '100%'
      fill.style.opacity = '0'
    }

    // ─── Spec 029: Path-Prefix Multi-Port ────────────────────────────────
    // Extracts the /_p<port>/ prefix from a path. Returns {port, path}.
    // If no prefix is present, port is null (caller falls back to default).
    // Examples:
    //   /                  → {port: null, path: '/'}
    //   /foo               → {port: null, path: '/foo'}
    //   /_p9090/           → {port: 9090, path: '/'}
    //   /_p9090/invoices   → {port: 9090, path: '/invoices'}
    function parsePortPrefix(path) {
      const m = path.match(/^\/_p(\d{1,5})(\/.*)?$/)
      if (!m) return { port: null, path }
      const port = parseInt(m[1], 10)
      if (port < 1 || port > 65535) return { port: null, path }  // invalid → treat as normal path
      const rest = m[2] || '/'
      return { port, path: rest }
    }

    // Builds a /_p<port>/ URL from a relative path and the current port context.
    // If currentPort is null or the daemon's default, the prefix is omitted (clean URL).
    // If currentPort is set and non-default, the prefix is prepended.
    function buildPortPath(targetPath, port = currentPort) {
      if (!targetPath.startsWith('/')) targetPath = '/' + targetPath
      // If targetPath already has a port prefix, leave it alone
      if (/^\/_p\d{1,5}\//.test(targetPath) || /^\/_p\d{1,5}$/.test(targetPath)) {
        return targetPath
      }
      if (port && port !== defaultPort) {
        return `/_p${port}${targetPath === '/' ? '/' : targetPath}`
      }
      return targetPath
    }

    // Tracks the port context for the current page. Set on navigate(),
    // used by fetch override + form/link intercepts.
    let currentPort = null     // null = default
    let defaultPort = 80       // updated when daemon reports its default_port (future)
    // For now, we don't know the daemon's default_port. Treat 80 as default.
    // If the path has no /_p prefix, currentPort stays null (default).

    async function navigate(path, redirectHops = 0) {
      currentPath = path  // track for reconnect restore
      if (!tunnel || tunnel.isClosed) {
        log('Tunnel disconnected — cannot navigate', 'log-err')
        return
      }
      if (redirectHops > 5) {
        log('Too many redirects (>5) — aborting', 'log-err')
        hideLoading()
        return
      }
      showLoading()
      log(`Navigating to ${path}…`)

      // Spec 029: parse /_p<port>/ prefix from path
      const parsed = parsePortPrefix(path)
      const wirePort = parsed.port || defaultPort
      const backendPath = parsed.path
      // Pin currentPort for subsequent fetches/forms on this page
      if (parsed.port !== null) {
        currentPort = parsed.port
      } else {
        currentPort = null  // default
      }

      try {
        const res = await tunnel.request({ port: wirePort, method: 'GET', path: backendPath })
        log(`Response: ${res.status} (${res.body.length} bytes)`, res.status < 400 ? 'log-ok' : 'log-err')

        // Follow 3xx redirects (max 5 hops to prevent loops)
        if (res.status >= 300 && res.status < 400) {
          const location = res.headers['location'] || res.headers['Location']
          if (location) {
            // Spec 029 FR-008: rewrite relative Location to preserve port context
            let target
            if (location.startsWith('http://') || location.startsWith('https://')) {
              // Absolute URL — pass through only if same-origin, else follow as-is
              const locUrl = new URL(location, window.location.origin)
              if (locUrl.origin === window.location.origin) {
                target = locUrl.pathname + locUrl.search
              } else {
                // Cross-origin redirect — open in top window
                log(`Cross-origin redirect → ${location}`)
                window.location.href = location
                return
              }
            } else {
              // Relative Location — resolve against current path, preserve port
              const resolved = new URL(location, window.location.origin + path).pathname + (new URL(location, window.location.origin + path).search || '')
              // Prepend current port prefix if we're in a non-default port context
              target = buildPortPath(resolved, currentPort)
            }
            log(`Redirect ${res.status} → ${target}`)
            return navigate(target, redirectHops + 1)
          }
        }

        const html = new TextDecoder().decode(res.body)

        // Update URL bar without page reload (preserve ?npub= for reload)
        history.pushState({ tunneled: true }, '', tunneledUrl(path))

        // Parse the HTML properly — innerHTML on a div strips <html>, <head>, <link> etc.
        const doc = new DOMParser().parseFromString(html, 'text/html')

        // First: set body content (clears everything from previous navigation)
        contentEl.innerHTML = doc.body.innerHTML

        // Then: fetch and inject CSS from <head> via tunnel (prepend so body styles win)
        for (const link of doc.querySelectorAll('link[rel="stylesheet"]')) {
          const href = link.getAttribute('href')
          if (!href || href.startsWith('http')) continue
          try {
            // Spec 029: resolve CSS href against backendPath (prefix-stripped)
            // not the original URL-path, otherwise /_p8082/assets/style.css
            // gets sent as the literal path to the backend.
            const cssUrl = new URL(href, window.location.origin + backendPath)
            const cssRes = await tunnel.request({ port: currentPort || defaultPort, method: 'GET', path: cssUrl.pathname })
            // Rewrite CSS selectors to scope under #tunneled-content so they
            // don't leak into the peck host UI. The old approach (only body→#tunneled-content)
            // let `header`, `nav`, `main`, `footer` rules hit the peck host's
            // own elements and produced broken layouts.
            let cssText = new TextDecoder().decode(cssRes.body)
            // Scope universal selectors first (before we mangle the bare tag names)
            cssText = cssText.replace(/^(\s*)\*/gm, '$1#tunneled-content *')
            // Bare tag selectors that conflict with peck host UI → scope them.
            // Only match selectors that start at line, comma, brace, or whitespace
            // boundaries — NOT inside compound selectors like .card-header.
            const scopeTags = ['html', 'body', 'header', 'nav', 'main', 'footer', 'section', 'article', 'aside']
            for (const tag of scopeTags) {
              // (^|[,>+~\s]) tag (\s*[,{>+~])
              const re = new RegExp(`(^|[,>+~\\s])${tag}(?=[\\s,>+~{])`, 'gm')
              cssText = cssText.replace(re, '$1#tunneled-content')
            }
            // Scope remaining bare element selectors (button, input, a, h1-h6, p,
            // table, img, etc.) that would leak into peck UI. We prepend
            // #tunneled-content to any selector that is a bare tag name at the
            // start of a selector list, so `button { ... }` becomes
            // `#tunneled-content button { ... }`.
            const bareTags = ['a','b','bdi','bdo','blockquote','br','button','caption','cite','code','col','colgroup','dd','del','details','dfn','dialog','dl','dt','em','fieldset','figcaption','figure','form','h1','h2','h3','h4','h5','h6','hr','i','iframe','img','input','ins','kbd','label','legend','li','mark','menu','ol','optgroup','option','output','p','pre','progress','q','samp','select','small','span','strong','sub','summary','sup','table','tbody','td','textarea','tfoot','th','thead','time','tr','u','ul','var','video']
            for (const tag of bareTags) {
              // Match bare tag as first selector in a rule or after comma
              cssText = cssText.replace(new RegExp(`(^|[},\\s])${tag}(?=[\\s.,:>+~{[])`, 'gm'), '$1#tunneled-content ' + tag)
            }
            const style = document.createElement('style')
            style.textContent = cssText
            contentEl.insertBefore(style, contentEl.firstChild)
          } catch (err) {
            log(`CSS load error (${href}): ${err.message}`, 'log-err')
          }
        }

        // Execute scripts — innerHTML doesn't run them, we need to re-create.
        // Each script is wrapped in an IIFE to give it a fresh scope.
        // Without this, `const`/`let` from the first run collide on re-execution
        // (e.g. navigating back to home) → SyntaxError → script silently fails.
        for (const oldScript of [...contentEl.querySelectorAll('script')]) {
          const newScript = document.createElement('script')
          const src = oldScript.getAttribute('src')
          if (src && !src.startsWith('http')) {
            try {
              const jsUrl = new URL(src, window.location.origin + backendPath)
              const jsRes = await tunnel.request({ port: currentPort || defaultPort, method: 'GET', path: jsUrl.pathname })
              newScript.textContent = `(function(){\n${new TextDecoder().decode(jsRes.body)}\n})()`
            } catch (err) {
              log(`JS load error (${src}): ${err.message}`, 'log-err')
              continue
            }
          } else if (src) {
            newScript.src = src
          } else {
            newScript.textContent = `(function(){\n${oldScript.textContent}\n})()`
          }
          oldScript.replaceWith(newScript)
        }

        // ─── Spec-perf-fix: fetch() override for tunneled content ──────
        // Apps that use relative fetch() (e.g. fetch('./api/time')) would
        // otherwise hit the peck host URL and get HTML back instead of the
        // API response. Patch window.fetch to route relative URLs through
        // the tunnel. Absolute URLs (http://, https://) are left alone.
        // Spec 029: also parse /_p<port>/ from relative URLs.
        if (!window.__peckFetchPatched) {
          window.__peckFetchPatched = true
          const origFetch = window.fetch.bind(window)
          window.fetch = async (input, init) => {
            const url = typeof input === 'string' ? input : input.url
            // Only intercept relative URLs (path or ./ or ../, no scheme)
            if (/^(https?:|blob:|data:)/i.test(url)) {
              return origFetch(input, init)
            }
            try {
              const resolved = new URL(url, window.location.origin + (window.__peckCurrentPath || '/'))
              // Spec 029: check for /_p<port>/ prefix in the URL
              const parsed = parsePortPrefix(resolved.pathname)
              const wirePort = parsed.port || currentPort || defaultPort
              const opts = {
                port: wirePort,
                method: (init && init.method) || 'GET',
                path: parsed.path + resolved.search,
                headers: (init && init.headers) || {},
                body: (init && init.body) ? (typeof init.body === 'string' ? new TextEncoder().encode(init.body) : init.body) : null,
              }
              const res = await window.peck.request(opts)
              const ab = res.body.buffer.slice(res.body.byteOffset, res.body.byteOffset + res.body.byteLength)
              return new Response(ab, {
                status: res.status,
                headers: res.headers,
              })
            } catch (err) {
              throw new TypeError(`peck tunnel fetch failed: ${err.message}`)
            }
          }
        }
        window.__peckCurrentPath = path

        // Resolve images via tunnel
        for (const img of contentEl.querySelectorAll('img[src]')) {
          const src = img.getAttribute('src')
          if (!src || src.startsWith('http') || src.startsWith('data:')) continue
          try {
            const imgUrl = new URL(src, window.location.origin + backendPath)
            const imgRes = await tunnel.request({ port: currentPort || defaultPort, method: 'GET', path: imgUrl.pathname })
            const blob = new Blob([imgRes.body], { type: imgRes.headers['content-type'] || 'image/png' })
            img.src = URL.createObjectURL(blob)
          } catch {}
        }

        // Wire up links for SPA-style navigation
        contentEl.querySelectorAll('a').forEach(linkIntercept)

        // Wire up forms
        contentEl.querySelectorAll('form').forEach(formIntercept)

        // Expose window.peck API so tunneled apps can reach other backend ports.
        // Usage: const res = await window.peck.request({ port: 3000, path: '/api/users' })
        window.peck = {
          request: (opts) => tunnel.request(opts),
          get isClosed() { return tunnel?.isClosed ?? true }
        }

        hideLoading()
        log('Page rendered')
      } catch (err) {
        hideLoading()
        log(`Navigation error: ${err.message}`, 'log-err')
      }
    }

    // Intercept link clicks → navigate through tunnel instead of page reload
    function linkIntercept(a) {
      const href = a.getAttribute('href')
      if (!href || href.startsWith('http') || href.startsWith('mailto:') || href.startsWith('#')) {
        // External links / anchors: let browser handle
        if (href && href.startsWith('http') && !href.includes(window.location.hostname)) {
          a.target = '_blank'  // open external in new tab
        }
        return
      }
      a.addEventListener('click', (e) => {
        e.preventDefault()
        const url = new URL(href, window.location.origin + window.location.pathname)
        // Spec 029: if relative link without /_p prefix, preserve current port context
        const target = buildPortPath(url.pathname + url.search, currentPort)
        navigate(target)
      })
    }

    // Intercept form submissions → submit through tunnel
    function formIntercept(form) {
      form.addEventListener('submit', (e) => {
        e.preventDefault()
        const method = (form.method || 'GET').toUpperCase()
        const rawAction = form.getAttribute('action') || window.location.pathname
        // Spec 029: resolve relative action against current path. Without this,
        // a form with action="./submit" sends "./submit" as the literal path
        // to the daemon, which 404s. We also strip any /_p<port>/ prefix
        // from the resolved path (the daemon handles port routing via wire-port).
        let action
        try {
          const resolved = new URL(rawAction, window.location.origin + window.location.pathname)
          action = resolved.pathname + resolved.search
        } catch {
          action = rawAction
        }

        if (method === 'GET') {
          const formData = new FormData(form)
          const params = new URLSearchParams(formData).toString()
          navigate(action + (action.includes('?') ? '&' : '?') + params)
        } else {
          // POST
          submitPost(form, action)
        }
      })
    }

    async function submitPost(form, action) {
      log(`POST to ${action}…`)
      try {
        const formData = new FormData(form)
        const body = new URLSearchParams(formData)
        const res = await tunnel.request({
          port: currentPort || defaultPort, method: 'POST', path: action,
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new TextEncoder().encode(body.toString())
        })
        log(`POST response: ${res.status} (${res.body.length} bytes)`, res.status < 400 ? 'log-ok' : 'log-err')

        const html = new TextDecoder().decode(res.body)
        history.pushState({ tunneled: true }, '', tunneledUrl(action))

        // Render result using the same DOMParser approach as navigate()
        const doc = new DOMParser().parseFromString(html, 'text/html')
        contentEl.innerHTML = doc.body.innerHTML
        for (const link of doc.querySelectorAll('link[rel="stylesheet"]')) {
          const href = link.getAttribute('href')
          if (!href || href.startsWith('http')) continue
          try {
            const cssUrl = new URL(href, window.location.origin + action)
            const cssRes = await tunnel.request({ port: currentPort || defaultPort, method: 'GET', path: cssUrl.pathname })
            let cssText = new TextDecoder().decode(cssRes.body)
            cssText = cssText.replace(/\bbody\b/g, '#tunneled-content')
            cssText = cssText.replace(/^(\s*)\*/gm, '$1#tunneled-content *')
            const bareTags2 = ['a','b','bdi','bdo','blockquote','br','button','caption','cite','code','col','colgroup','dd','del','details','dfn','dialog','dl','dt','em','fieldset','figcaption','figure','form','h1','h2','h3','h4','h5','h6','hr','i','iframe','img','input','ins','kbd','label','legend','li','mark','menu','ol','optgroup','option','output','p','pre','progress','q','samp','select','small','span','strong','sub','summary','sup','table','tbody','td','textarea','tfoot','th','thead','time','tr','u','ul','var','video']
            for (const tag of bareTags2) {
              cssText = cssText.replace(new RegExp(`(^|[},\\s])${tag}(?=[\\s.,:>+~{[])`, 'gm'), '$1#tunneled-content ' + tag)
            }
            const style = document.createElement('style')
            style.textContent = cssText
            contentEl.insertBefore(style, contentEl.firstChild)
          } catch {}
        }
        for (const oldScript of [...contentEl.querySelectorAll('script')]) {
          const newScript = document.createElement('script')
          const src = oldScript.getAttribute('src')
          if (src && !src.startsWith('http')) {
            try {
              const jsUrl = new URL(src, window.location.origin + action)
              const jsRes = await tunnel.request({ port: currentPort || defaultPort, method: 'GET', path: jsUrl.pathname })
              newScript.textContent = `(function(){\n${new TextDecoder().decode(jsRes.body)}\n})()`
            } catch { continue }
          } else if (src) {
            newScript.src = src
          } else {
            newScript.textContent = `(function(){\n${oldScript.textContent}\n})()`
          }
          oldScript.replaceWith(newScript)
        }
        contentEl.querySelectorAll('a').forEach(linkIntercept)
        contentEl.querySelectorAll('form').forEach(formIntercept)
        log('POST result rendered')
      } catch (err) {
        log(`POST error: ${err.message}`, 'log-err')
      }
    }

    // Handle back/forward buttons — strip ?npub= from URL before navigating
    window.addEventListener('popstate', (event) => {
      const path = window.location.pathname + window.location.search
      // Remove npub param, it's a peck concern not a tunnel concern
      const cleanPath = path.replace(/[\?&]npub=[^&]+/, '').replace(/\?$/, '')
      if (event.state?.tunneled) {
        navigate(cleanPath || '/')
      }
    })

    // ─── Reconnect State ───

    let reconnectAttempts = 0
    // Spec 037: from PECK_CONFIG (falls back to PECK_DEFAULTS)
    const MAX_RECONNECT = PECK_CONFIG.reconnect.max_attempts
    const RECONNECT_DELAYS = PECK_CONFIG.reconnect.delays_ms
    let currentNpub = null
    let currentRelays = null
    let lastKnownExitIPs = new Set()  // all srflx IPs at connect time (for smart reconnect)
    let reconnectMode = peckGetSetting('peck_reconnect_mode') || 'smart'

    function updateReconnectControl() {
      reconnectControl.querySelectorAll('button').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.val === reconnectMode)
      })
      const hints = {
        off: 'No automatic reconnect on disconnect',
        on: 'Always reconnect automatically (may leak real IP if VPN drops)',
        smart: 'Reconnect only if your external IP is unchanged'
      }
      reconnectHint.textContent = hints[reconnectMode] || hints.off
    }
    reconnectControl.addEventListener('click', e => {
      const btn = e.target.closest('button')
      if (!btn) return
      reconnectMode = btn.dataset.val
      peckSetSetting('peck_reconnect_mode', reconnectMode)
      updateReconnectControl()
    })
    updateReconnectControl()

    /**
     * Query current server-reflexive IPs via a lightweight STUN probe.
     * Used by smart reconnect to detect IP changes (e.g. VPN dropped → real IP).
     * Returns ALL srflx IPs (v4 + v6) as a Set so the caller can check
     * membership rather than exact string equality (avoids v4/v6 mismatch).
     */
    async function probeExternalIPs() {
      return new Promise(resolve => {
        const ips = new Set()
        try {
          const pc = new RTCPeerConnection({
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
          })
          pc.onicecandidate = (e) => {
            if (!e.candidate) { try { pc.close() } catch {}; resolve([...ips]); return }
            const parts = e.candidate.candidate.split(' ')
            const typIdx = parts.indexOf('typ') + 1
            if (typIdx > 0 && parts[typIdx] === 'srflx') {
              ips.add(parts[4])
            }
          }
          pc.createDataChannel('probe')
          pc.createOffer().then(o => pc.setLocalDescription(o)).catch(() => resolve([]))
          // Timeout after 5s
          setTimeout(() => { try { pc.close() } catch {}; resolve([...ips]) }, 5000)
        } catch { resolve([]) }
      })
    }

    function handleDisconnect() {
      tunnelReady = false
      if (diagInterval) { clearInterval(diagInterval); diagInterval = null }
      headerDiag.textContent = ''

      // Respect reconnect mode (spec 012 extension: auto-reconnect privacy control)
      if (reconnectMode === 'off') {
        setStatus('failure', 'connection lost')
        log('Disconnected. Auto-reconnect is off.', 'log-err')
        showReconnectOverlay()
        return
      }

      // Smart mode: check if external IPs are identical before reconnecting
      if (reconnectMode === 'smart' && lastKnownExitIPs.size > 0) {
        log('Smart reconnect: checking if external IPs changed…')
        probeExternalIPs().then(currentIPs => {
          if (currentIPs.length === 0) {
            // STUN probe failed. We have a known IP set from connect time,
            // so we CANNOT verify that the IPs are still the same.
            // Block reconnect to protect privacy (VPN drop would go undetected).
            setStatus('failure', 'IP check failed — reconnect blocked')
            log(`Smart reconnect: STUN probe returned no IPs. Cannot verify privacy. Before: [${[...lastKnownExitIPs].sort().join(', ')}]. Auto-reconnect blocked.`, 'log-err')
            showReconnectOverlay()
          } else {
            // Compare sets: sort both, join as string, compare
            const before = [...lastKnownExitIPs].sort().join(',')
            const now = [...currentIPs].sort().join(',')
            if (before === now) {
              log(`Smart reconnect: IPs unchanged ([${now}]). Proceeding with reconnect.`)
              scheduleReconnect()
            } else {
              setStatus('failure', 'IP changed — reconnect blocked')
              log(`Smart reconnect: IPs changed. Before: [${before}] Now: [${now}]. Auto-reconnect blocked to protect privacy.`, 'log-err')
              showReconnectOverlay()
            }
          }
        })
        return
      }

      // 'on' mode: reconnect unconditionally
      scheduleReconnect()
    }

    function scheduleReconnect() {
      if (reconnectAttempts >= MAX_RECONNECT) {
        setStatus('failure', 'connection lost')
        log(`Reconnect failed after ${MAX_RECONNECT} attempts`, 'log-err')
        showReconnectOverlay()
        return
      }

      const delay = RECONNECT_DELAYS[Math.min(reconnectAttempts, RECONNECT_DELAYS.length - 1)]
      reconnectAttempts++
      setStatus('connecting', `reconnecting… (${reconnectAttempts}/${MAX_RECONNECT})`)
      log(`Reconnect attempt ${reconnectAttempts}/${MAX_RECONNECT} in ${delay/1000}s…`, 'log-err')

      setTimeout(() => attemptReconnect(), delay)
    }

    /**
     * Spec 026: handle loud-deny from the daemon.
     * Stop reconnect attempts (daemon explicitly denied us) and surface
     * the message to the user.
     */
    function handleDeny(message) {
      tunnelReady = false
      reconnectAttempts = MAX_RECONNECT  // prevent auto-reconnect
      if (diagInterval) { clearInterval(diagInterval); diagInterval = null }
      headerDiag.textContent = ''
      setStatus('failure', 'access denied')
      log(`🚫 Access denied by daemon: ${message}`, 'log-err')
    }

    /**
     * Spec 033: handle terms-challenge from the daemon.
     * Shows a modal with terms text. User clicks Accept → transport.acceptTerms(version).
     * If auto_accept_terms is enabled, acceptTerms is called immediately
     * (auto_accept_terms is resolved via peckGetSetting by the caller and passed
     * to connect() → NativeTransport — NOT read from localStorage directly).
     *
     * Spec 034 addition: once the user has accepted a version in this session
     * (sessionStorage), subsequent reconnects auto-accept the same version
     * without showing the modal again.
     */
    function handleTermsChallenge(text, version, transport) {
      log(`📄 Terms of Service challenge (version ${version})`, '')

      // Session-level auto-accept: if we already accepted this exact version
      // earlier in this browser session, skip the modal and accept silently.
      const sessionAccepted = sessionStorage.getItem('peck_session_terms_version')
      if (sessionAccepted === version) {
        transport.acceptTerms(version)
        setStatus('connecting', truncateNpub(currentNpub || ''))
        log(`✅ Terms auto-accepted for this session (v${version})`, 'log-ok')
        return
      }

      setStatus('connecting', 'awaiting terms…')

      // Build modal
      const overlay = document.createElement('div')
      overlay.id = 'terms-overlay'
      overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:10000;display:flex;align-items:center;justify-content:center;'

      const modal = document.createElement('div')
      modal.style.cssText = 'background:#161b22;color:#e6edf3;border-radius:12px;padding:24px;max-width:560px;max-height:80vh;display:flex;flex-direction:column;gap:16px;font-family:ui-monospace,monospace;font-size:14px;'

      const title = document.createElement('h3')
      title.textContent = 'Terms of Service'
      title.style.cssText = 'margin:0;color:#f59e0b;font-size:18px;'
      modal.appendChild(title)

      const body = document.createElement('pre')
      body.textContent = text
      body.style.cssText = 'white-space:pre-wrap;word-wrap:break-word;overflow-y:auto;max-height:50vh;margin:0;font-family:inherit;line-height:1.5;'
      modal.appendChild(body)

      const buttons = document.createElement('div')
      buttons.style.cssText = 'display:flex;gap:12px;justify-content:flex-end;'

      const btnDecline = document.createElement('button')
      btnDecline.textContent = 'Decline'
      btnDecline.style.cssText = 'padding:8px 16px;border-radius:6px;border:1px solid #f85149;background:transparent;color:#f85149;cursor:pointer;font-size:14px;'
      btnDecline.onclick = () => {
        overlay.remove()
        reconnectAttempts = MAX_RECONNECT
        setStatus('failure', 'terms declined')
        log('Terms declined', 'log-err')
      }

      const btnAccept = document.createElement('button')
      btnAccept.textContent = 'Accept'
      btnAccept.style.cssText = 'padding:8px 16px;border-radius:6px;border:none;background:#f59e0b;color:#0d1117;cursor:pointer;font-weight:600;font-size:14px;'
      btnAccept.onclick = () => {
        overlay.remove()
        transport.acceptTerms(version)
        sessionStorage.setItem('peck_session_terms_version', version)
        peckSetSetting('peck_accepted_terms_version', version)
        updateAutoAcceptToggle()
        setStatus('connecting', truncateNpub(currentNpub || ''))
        log(`✅ Terms accepted (version ${version})`, 'log-ok')
      }

      buttons.appendChild(btnDecline)
      buttons.appendChild(btnAccept)
      modal.appendChild(buttons)
      overlay.appendChild(modal)
      document.body.appendChild(overlay)
    }

    /**
     * Shared debug handler for both startConnection() and attemptReconnect().
     * Matches the TrysteroTransport calling convention: onDebug(msg, data).
     */
    function debugHandler(msg, data) {
      const labels = {
        relay_connected: () => { relayStates[data?.url] = 'connected'; renderRelayPills(); return `✓ Relays: ${data?.url ?? '?'}` + (data?.count ? ` (${data.count})` : '') },
        relay_failed: () => { relayStates[data?.url] = 'failed'; renderRelayPills(); return `✗ Relay failed: ${data?.url ?? '?'} — ${data?.error ?? 'unknown'}` },
        relay_dead: () => `⚡ Relay dead: ${data?.url ?? '?'}`,
        relay_reconnect: () => `↻ Reconnecting: ${data?.url ?? '?'}`,
        subscribe: () => `◉ Subscribed to DMs`,
        dm_sent: () => `→ ${data?.type ?? '?'} → ${data?.relay ?? '?'} (${data?.len ?? 0}b)`,
        dm_received: () => `← from ${data?.from ?? '?'} (${data?.len ?? 0}b)`,
        dm_seen: () => `👁 DM from ${data?.from ?? '?'} → ${data?.to ?? '?'} (we=${data?.ourPubkey ?? '?'}, daemon=${data?.daemonPubkey ?? '?'})`,
        // Show all relay messages of type NOTICE/OK/EOSE for debugging
        relay_msg: () => {
          if (!data) return null
          if (data.type === 'OK') return `✓ OK: ${data.preview?.slice(0, 100) ?? ''}`
          if (data.type === 'NOTICE') return `⚠ NOTICE: ${data.preview?.slice(0, 100) ?? ''}`
          if (data.type === 'EOSE') return `◉ EOSE: ${data.url ?? '?'}`
          if (data.type === 'EVENT') return null  // suppress EVENT noise
          return null
        },
        relay_notice: () => `⚠ ${data?.url ?? '?'}: ${data?.message ?? ''}`,
        relay_ok: () => data?.accepted ? null : `✗ Rejected by ${data?.url ?? '?'}: ${data?.message ?? ''}`,
        relay_closed: () => { relayStates[data?.url] = 'closed'; renderRelayPills(); return `⚠ ${data?.url ?? '?'} CLOSED: ${data?.message ?? ''}` },
        ws_close: () => `⚡ WS closed: ${data?.url ?? '?'} (code: ${data?.code ?? '?'}${data?.reason ? ', ' + data.reason : ''})`,
        ice_candidate: () => `ICE ${data?.type ?? '?'}: ${data?.ip ?? '?'}:${data?.port ?? '?'}`,
        peer_connected: () => `🔗 Peer connected: ${data?.peerId ?? '?'}`,
        peer_disconnected: () => `🔌 Peer disconnected: ${data?.peerId ?? '?'}`,
        init: () => `📝 init peerId=${data?.peerId ?? '?'}`,
        announce_sent: () => `📡 announce sent`,
        answer_sent: () => `📡 answer sent`,
        pc_state: () => `🔌 PC: ${data?.state ?? '?'}`,
        offer_apply_error: () => `✗ offer error: ${data?.error ?? '?'}`,
        candidate_apply_error: () => `✗ candidate error: ${data?.error ?? '?'}`,
        nip44_decrypt_failed: () => `✗ NIP-44 decrypt failed: ${data?.error ?? '?'}`,
        datachannel_received: () => `📡 datachannel: ${data?.label ?? '?'}`,
        channel_open: () => `📡 channel open: ${data?.label ?? '?'}`,
        channel_close: () => `📡 channel close: ${data?.label ?? '?'}`,
        channel_error: () => `✗ channel error: ${data?.error ?? '?'}`,
        terms_challenge: () => `📄 terms challenge (v${data?.version ?? '?'})`,
        terms_auto_accepted: () => `✅ terms auto-accepted (v${data?.version ?? '?'})`,
        terms_accept_sent: () => `→ terms-accept (v${data?.version ?? '?'})`,
        request_ip_received: () => `📤 request-ip from daemon`,
        re_announce_with_ip: () => `→ re-announce with client_ip=${data?.client_ip ?? '?'}`,
        re_announce_without_ip: () => `→ re-announce (no client_ip resolved)`,
        client_ip_resolved: () => `🧊 client IP: ${data?.ip ?? 'none'}`,
        client_ip_resolve_failed: () => `✗ client IP resolve failed`,
      }
      const fn = labels[msg]
      const label = fn ? fn() : msg
      if (label) log(label, msg.includes('dead') || msg.includes('failed') || msg.includes('closed') || msg.includes('Rejected') || msg.includes('error') ? 'log-err' : '')
    }

    async function attemptReconnect() {
      if (!currentNpub) return
      log(`Reconnecting…`)
      try {
        tunnel = await connect({
          npub: currentNpub,
          relays: currentRelays,
          timeout: 15000,
          onDisconnect: handleDisconnect,
          onDeny: handleDeny,
          onTermsChallenge: handleTermsChallenge,
          onOfferSdp: parseOfferSdp,
          onAnswerSdp: parseAnswerSdp,
          onOwnIps: handleOwnIpsFromStun,
          ipPreference: peckGetSetting('peck_ip_preference') || 'both',
          autoAcceptTerms: peckGetSetting('peck_auto_accept_terms') === 'true',
          onDebug: debugHandler
        })

        // Success!
        reconnectAttempts = 0
        tunnelReady = true
        setStatus('connected', truncateNpub(currentNpub))
        log('Reconnected!', 'log-ok')

        // Re-setup SW with new tunnel
        const sw = await setupServiceWorker()
        if (sw) {
          try {
            await Promise.race([
              connectServiceWorker(sw),
              new Promise((_, reject) => setTimeout(() => reject(new Error('SW connect timeout')), 5000))
            ])
          } catch (err) {
            log(`SW connect skipped: ${err.message}`)
          }
        }

        // Resume diagnostics
        diagInterval = setInterval(async () => {
          try {
            const d = await tunnel.getDiagnostics()
            if (d) {
              const line = formatDiagnostics(d)
              if (line) { headerDiag.textContent = line; diagLine.textContent = line }
            }
          } catch {}
        }, 3000)

        // Restore last page
        await navigate(currentPath)

      } catch (err) {
        log(`Reconnect failed: ${err.message}`, 'log-err')
        // schedule next attempt
        if (reconnectAttempts >= MAX_RECONNECT) {
          setStatus('failure', 'connection lost')
          showReconnectOverlay()
        } else {
          const delay = RECONNECT_DELAYS[Math.min(reconnectAttempts, RECONNECT_DELAYS.length - 1)]
          reconnectAttempts++
          setStatus('connecting', `reconnecting… (${reconnectAttempts}/${MAX_RECONNECT})`)
          log(`Next attempt in ${delay/1000}s…`)
          setTimeout(() => attemptReconnect(), delay)
        }
      }
    }

    function showReconnectOverlay() {
      contentEl.innerHTML = `
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:80vh;gap:1rem;font-family:system-ui,sans-serif">
          <div style="font-size:3rem">⚠</div>
          <h2 style="color:#f85149;font-size:1.2rem">Connection to tunnel lost</h2>
          <p style="color:#8b949e;font-size:0.9rem;max-width:400px;text-align:center">
            The peck daemon may have restarted or your network changed.
          </p>
          <div style="display:flex;gap:0.5rem">
            <button id="btn-retry" style="padding:8px 24px;background:#238636;color:white;border:none;border-radius:6px;cursor:pointer;font-size:14px">Reconnect</button>
            <button id="btn-home" style="padding:8px 24px;background:#21262d;color:#c9d1d9;border:1px solid #30363d;border-radius:6px;cursor:pointer;font-size:14px">Go Home</button>
          </div>
        </div>`
      document.getElementById('btn-retry')?.addEventListener('click', () => {
        reconnectAttempts = 0
        startConnection(currentNpub, currentRelays.join(', '))
      })
      document.getElementById('btn-home')?.addEventListener('click', () => {
        // Subdomain survives navigation, no ?npub= needed
        if (npubFromSubdomain()) {
          window.location.href = '/'
          return
        }
        const npub = sessionStorage.getItem('peck-npub')
        window.location.href = npub ? `/?npub=${npub}` : '/'
      })
    }

    // ─── Connection ───

    async function startConnection(npub, relay) {
      // Abort any in-flight connection from a previous attempt
      if (tunnel) { try { tunnel.close() } catch {}; tunnel = null }
      tunnelReady = false
      if (diagInterval) { clearInterval(diagInterval); diagInterval = null }
      diagLine.textContent = ''
      headerDiag.textContent = ''
      logEl.innerHTML = ''
      reconnectAttempts = 0
      currentNpub = npub
      currentPath = '/'
      lastKnownExitIPs = new Set()  // reset for new connection
      debugNpub.value = npub
      setStatus('connecting', truncateNpub(npub))
      log(`Connecting to ${npub.slice(0, 20)}…`)
      const relayList = relay.split(',').map(s => s.trim()).filter(Boolean)
      currentRelays = relayList
      log(`Relays: ${relayList.join(', ')}`)

      // Validate npub format before attempting connection
      if (!npub || (!npub.startsWith('npub1') && !/^[0-9a-f]{64}$/i.test(npub))) {
        setStatus('failure', npub ? truncateNpub(npub) : '—')
        log('Error: Invalid npub format. Expected npub1... or 64-char hex.', 'log-err')
        return
      }

      try {
        tunnel = await connect({
          npub,
          relays: relayList,
          timeout: 15000,
          onDisconnect: handleDisconnect,
          onDeny: handleDeny,
          onTermsChallenge: handleTermsChallenge,
          onOfferSdp: parseOfferSdp,
          onAnswerSdp: parseAnswerSdp,
          onOwnIps: handleOwnIpsFromStun,
          ipPreference: peckGetSetting('peck_ip_preference') || 'both',
          autoAcceptTerms: peckGetSetting('peck_auto_accept_terms') === 'true',
          onDebug: debugHandler
        })
        _ephemeralNpub = tunnel.ephemeralNpub  // Spec 040: expose for identity display
        _ephemeralNsec = tunnel.ephemeralNsec  // Spec 040: expose for identity display
        tunnelReady = true
        setStatus('connected', truncateNpub(npub))
        log('Peer connected', 'log-ok')

        // Spec 040: refresh identity section now that ephemeral keys are available
        // (needed for vault-skipped and vault-off states where renderIdentity ran
        // before connect() set _ephemeralNsec)
        if (window._identityReady) renderIdentity()

        // Setup SW for sub-assets (CSS, JS, images, fetch)
        const sw = await setupServiceWorker()
        if (sw) {
          try {
            await Promise.race([
              connectServiceWorker(sw),
              new Promise((_, reject) => setTimeout(() => reject(new Error('SW connect timeout')), 5000))
            ])
          } catch (err) {
            log(`SW connect skipped: ${err.message}`)
          }
        }

        // Diagnostics
        function updateDiag(d) {
          const line = formatDiagnostics(d)
          if (!line) return
          // Mark the currently selected pair in IP lists
          if (d.localIp) ownExitIPs.forEach(e => { e.connected = (e.ip === d.localIp) })
          if (d.remoteIp) daemonExitIPs.forEach(e => { e.connected = (e.ip === d.remoteIp) })
          renderIpList(exitContainer, daemonExitIPs, daemonIpVersions)
          renderIpList(ownIpContainer, ownExitIPs, ownIpVersions)
          headerDiag.textContent = line
          diagLine.textContent = line
        }
        diagInterval = setInterval(async () => {
          try {
            const d = await tunnel.getDiagnostics()
            if (d) updateDiag(d)
          } catch {}
        }, 3000)
        setTimeout(async () => {
          try {
            const d = await tunnel.getDiagnostics()
            if (d) { updateDiag(d); log(formatDiagnostics(d)) }
          } catch {}
        }, 1000)

        // Load first page through tunnel.
        // Spec 029: respect the /_p<port>/ prefix if present in the
        // initial URL — otherwise we lose the port context on first load.
        const initialPath = window.location.pathname + window.location.search
        await navigate(initialPath === '/' ? '/' : initialPath)

      } catch (err) {
        setStatus('failure', truncateNpub(npub))
        // User-friendly error messages
        let msg = err.message
        if (msg.includes('no relays connected') || msg.includes('relay')) {
          msg = 'No relays connected. Check your internet connection.'
        } else if (msg.includes('timeout') || msg.includes('Timeout')) {
          msg = 'Daemon unreachable. The daemon may be offline or the npub is invalid.'
        }
        log(`Error: ${msg}`, 'log-err')
        if (diagInterval) { clearInterval(diagInterval); diagInterval = null }
        tunnel = null
        tunnelReady = false
      }
    }

    // ─── Init ───

    // Mobile pull-to-refresh is handled entirely via CSS + viewport meta:
    //   - maximum-scale=1.0 + user-scalable=no → can't zoom-out
    //   - overscroll-behavior-y: contain on html/body → no rubber-band
    //   - touch-action: pan-x pan-y on #tunneled-content → scroll but no zoom
    //
    // A previous version also had a JS touchmove handler that called
    // preventDefault() on downward swipes at scrollY<=0. But it broke
    // scrolling inside #tunneled-content because window.scrollY is always 0
    // (the body doesn't scroll — the content wrapper does). Removed.

    // Detect page hide (mobile), unload, visibility loss to clean up.
    // The SW's beforeunload UNREGISTER already clears the tunnel port,
    // but we also want to abort any in-flight WebRTC connection.
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden' && tunnel && !tunnelReady) {
        // Page hidden while still connecting — abort
        try { tunnel.close() } catch {}
        tunnel = null
      }
    })

    // ─── Spec 039 FR-007: Refresh all settings-dependent UI after vault unlock ───
    // During boot, while the vault is locked, peckGetSetting returns defaults.
    // After decrypt (or skip), this re-reads all vault settings and refreshes
    // every UI element that was initialized with stale default values.
    function refreshSettingsUI() {
      // Relays input
      restoreSavedRelays()
      // Reconnect mode (variable + UI)
      reconnectMode = peckGetSetting('peck_reconnect_mode') || 'smart'
      updateReconnectControl()
      // Auto-accept terms toggle
      updateAutoAcceptToggle()
      // IP version preference
      updateIpVersionControl()
      // Identity section
      if (window._identityReady) renderIdentity()
    }

    // ─── Spec 037: Boot (config → gate → connect) ───
    loadServerConfig().then(async () => {
      // Populate default relays into the hidden input
      const relayInput = $('debug-relay')
      if (relayInput && !relayInput.value) {
        relayInput.value = PECK_CONFIG.default_relays.join(', ')
      }

      // Mandatory info gate
      if (needsInfoGate() && localStorage.getItem('peck-info-accepted') !== 'true') {
        await showMandatoryGate()
      }

      // Spec 039 FR-007: Wait for vault decrypt/skip before connecting.
      // Without this, peck connects with default settings even though
      // the user's actual settings are still locked in the vault.
      if (_vaultActive) {
        setStatus('connecting', 'awaiting vault…')
        await _vaultGate
      }

      // Boot peck (original logic)
      const npub = await resolveNpub()
      if (npub) {
        sessionStorage.setItem('peck-npub', npub)
        debugNpub.value = npub
        startConnection(npub, debugRelay.value.trim() || PECK_CONFIG.default_relays[0])
      } else {
        setStatus('failure', 'No pubkey')
        openSettings()
        debugNpub.focus()
        log('No pubkey found in URL. Enter one manually.')
